name: Build APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Materialize platform folders (android/ios/etc.)
        # If android/ ios/ etc. are not committed, generate them once so the
        # build can proceed. Idempotent — safe if they already exist.
        run: |
          if [ ! -d android ]; then
            flutter create \
              --project-name ai_pacer \
              --org com.retailai \
              --platforms=android \
              --description "AI PACER" \
              .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: |
          # Build a per-ABI split so the universal APK stays small (around
          # 25-30 MB instead of ~50 MB). Each ABI is published as its own
          # asset; the fat universal APK is regenerated by merging the
          # splits with the bundletool-equivalent step below.
          # AI の接続先(mdlink-mobile-app-agent)。GitHub Variable AI_AGENT_BASE_URL で上書きできる
          flutter build apk --release --split-per-abi --tree-shake-icons \
            --dart-define=AI_AGENT_BASE_URL=${{ vars.AI_AGENT_BASE_URL || 'https://mdlink-mobile-app-agent-cjy6246wiq-an.a.run.app/api/v1/ai' }}
          ls -la build/app/outputs/flutter-apk/
          # Promote the smallest split (arm64-v8a) as the primary release
          # APK; it covers all modern Android phones. The fat universal
          # APK is still uploaded for legacy devices.
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/ai-pacer-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             build/app/outputs/flutter-apk/ai-pacer-release-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
             build/app/outputs/flutter-apk/ai-pacer-release-x86_64.apk
          ls -la build/app/outputs/flutter-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-pacer-release-apk
          path: |
            build/app/outputs/flutter-apk/ai-pacer-release.apk
            build/app/outputs/flutter-apk/ai-pacer-release-armeabi-v7a.apk
            build/app/outputs/flutter-apk/ai-pacer-release-x86_64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with APK and QR code
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APK_DOWNLOAD_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/ai-pacer-release.apk
        run: |
          python -m pip install --quiet qrcode[pil]
          python -c "
          import qrcode
          from qrcode.constants import ERROR_CORRECT_M
          url = '$APK_DOWNLOAD_URL'
          qr = qrcode.QRCode(
              version=None,
              error_correction=ERROR_CORRECT_M,
              box_size=10,
              border=4,
          )
          qr.add_data(url)
          qr.make(fit=True)
          img = qr.make_image(fill_color='#0A0F1F', back_color='white').convert('RGB')
          img.save('ai-pacer-qrcode.png')
          print('QR written for', url)
          "
          mkdir -p dist
          cp build/app/outputs/flutter-apk/ai-pacer-release.apk dist/
          cp build/app/outputs/flutter-apk/ai-pacer-release-armeabi-v7a.apk dist/ || true
          cp build/app/outputs/flutter-apk/ai-pacer-release-x86_64.apk dist/ || true
          cp ai-pacer-qrcode.png dist/

      - name: Publish Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/ai-pacer-release.apk
            dist/ai-pacer-release-armeabi-v7a.apk
            dist/ai-pacer-release-x86_64.apk
            dist/ai-pacer-qrcode.png
          body: |
            ## Download

            | QR code | Direct APK |
            | --- | --- |
            | ![QR code](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ai-pacer-qrcode.png) | [ai-pacer-release.apk (arm64-v8a, recommended)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ai-pacer-release.apk) |

            Per-ABI downloads:
            - [arm64-v8a (most modern phones)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ai-pacer-release.apk)
            - [armeabi-v7a](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ai-pacer-release-armeabi-v7a.apk)
            - [x86_64 (emulator)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ai-pacer-release-x86_64.apk)

            Scan the QR code with your Android phone to download and install the
            AI PACER build. You may need to allow installation from
            unknown sources.

            Build metadata:
            - Flutter 3.47.2
            - Java 17
            - AGP 8.11.1
            - Kotlin 2.2.20