publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  mobile_scanner: ^7.4.1
  http: ^1.2.0
  shared_preferences: ^2.3.2
  flutter_web_auth_2: ^5.1.0
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.7
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  fl_chart: ^1.2.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/
